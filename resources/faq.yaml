# FAQ 只记录已有接口和规则能支持的结论；没有时效或金额承诺。
- question: 退款审核通过就到账了吗
  aliases: [退款已批准就是退款成功吗, 审核通过和退款成功是一回事吗]
  answer: 不是。审核通过是退款申请的状态；还要查看关联退款流水是否为成功。审核状态本身不能证明款项已经到账。
  section: 查询退款进度
- question: 查订单应该发订单号还是订单ID
  aliases: [发订单号还是订单ID, 订单号和订单ID有什么区别]
  answer: 文本请发订单号（orderNo）。订单卡片里的 id 使用订单 ID（orderId），两者不能混用。
  section: 查订单和支付
- question: 酒店的起价是全部房费吗
  aliases: [酒店起价是总价吗, 每晚起价是不是整个住宿的价格]
  answer: 不是。酒店的起价只代表查询日期范围内的参考最低价格。房型明细可读首晚价格和逐日库存、价格，不应把首晚价格当成整段住宿总价。
  section: 商品价格和预订条件
