[project]
name = "travel-custom-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncmy>=0.2.18",
    "cryptography>=50.0.2",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
