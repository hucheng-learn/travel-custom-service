<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f7f6">
  <title>旅伴 · 在线客服</title>
  <link rel="stylesheet" href="/assets/styles.css?v=4">
  <script src="/assets/app.js?v=6" defer></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.8 8.2-2.1 5.5-5.5 2.1 2.1-5.5 5.5-2.1Z"/></symbol>
    <symbol id="i-headset" viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 1 1 16 0v4a4 4 0 0 1-4 4h-3"/><path d="M4 12h2a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2H5a1 1 0 0 1-1-1v-4Zm16 0h-2a2 2 0 0 0-2 2v1a2 2 0 0 0 2 2h1a1 1 0 0 0 1-1v-4Z"/></symbol>
    <symbol id="i-order" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 8.5h6m-6 4h6m-6 4h3"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M19 10c0 4.5-7 10-7 10s-7-5.5-7-10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.3"/></symbol>
    <symbol id="i-plane" viewBox="0 0 24 24"><path d="M17.5 4.5c1-1 2.7-1.5 3.2-1 .5.5 0 2.2-1 3.2L16 10.4l2 7.7-1.8 1.8-3.6-6-3.3 3.3.1 2.4-1.4 1.4-1.8-3.5L2.8 16l1.4-1.4 2.4.1 3.3-3.3-6-3.6 1.8-1.8 7.7 2 4.1-3.5Z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.4 2.7 7.7 7 10 4.3-2.3 7-5.6 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-up-right" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m21 3-6.4 18-4.1-7.5L3 9.4 21 3Zm0 0-10.5 10.5"/></symbol>
  </svg>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-compass"/></svg></span>
        <span class="brand-name">旅伴</span>
        <span class="brand-section">旅行服务中心</span>
      </div>
      <form id="preview-form" class="preview-form" hidden>
        <label for="preview-user">用户 ID</label>
        <input id="preview-user" list="recent-users" inputmode="numeric" pattern="[0-9]{1,19}" maxlength="19"
               placeholder="输入或选择用户 ID" autocomplete="off" required>
        <datalist id="recent-users"></datalist>
        <button id="preview-submit" class="primary" type="submit">查询</button>
        <p id="preview-status" role="status">请选择用户后开始</p>
      </form>
    </div>
  </header>

  <main class="workspace">
    <aside class="service-sidebar" aria-label="会话与常用服务">
      <div class="travel-hero">
        <p class="hero-title">旅途上的事，随时问我</p>
      </div>

      <section class="services conversations" aria-labelledby="conversations-title">
        <div class="panel-heading">
          <h2 id="conversations-title">历史会话</h2>
          <button id="new-chat" class="new-chat" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>新对话
          </button>
        </div>
        <p id="sessions-status" class="panel-status" role="status"></p>
        <div id="sessions-list" class="sessions-list"></div>
        <button id="more-sessions" class="quiet-button" type="button" hidden>更多会话</button>
      </section>

      <!-- 快捷入口把常见需求填入输入框，旅客可以修改后再发送。 -->
      <section class="services">
        <h2 id="services-title">常用服务</h2>
        <div class="service-list">
          <details class="service">
            <summary>
              <span class="service-icon mint"><svg class="icon" aria-hidden="true"><use href="#i-order"/></svg></span>
              <span class="service-copy"><strong>订单与支付</strong><small>订单状态、付款信息</small></span>
              <svg class="icon chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
            </summary>
            <div class="service-prompts">
              <button type="button" data-prompt="帮我查订单">查订单与支付状态</button>
            </div>
          </details>
          <details class="service">
            <summary>
              <span class="service-icon sky"><svg class="icon" aria-hidden="true"><use href="#i-map"/></svg></span>
              <span class="service-copy"><strong>我的行程</strong><small>出行安排、按日期查行程</small></span>
              <svg class="icon chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
            </summary>
            <div class="service-prompts">
              <button type="button" data-prompt="帮我查行程">查订单行程</button>
              <button type="button" data-prompt="下周一的出行">按日期查行程</button>
            </div>
          </details>
          <details class="service">
            <summary>
              <span class="service-icon sand"><svg class="icon" aria-hidden="true"><use href="#i-plane"/></svg></span>
              <span class="service-copy"><strong>出行产品查询</strong><small>车票、机票、酒店、景点</small></span>
              <svg class="icon chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
            </summary>
            <div class="service-prompts">
              <button type="button" data-prompt="帮我查酒店">酒店</button>
              <button type="button" data-prompt="帮我查景点">景点</button>
              <button type="button" data-prompt="帮我查高铁">高铁</button>
              <button type="button" data-prompt="帮我查机票">机票</button>
              <button type="button" data-prompt="帮我查汽车票">汽车票</button>
              <button type="button" data-prompt="帮我查接机服务">接机</button>
            </div>
          </details>
          <details class="service">
            <summary>
              <span class="service-icon lilac"><svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg></span>
              <span class="service-copy"><strong>退款与售后</strong><small>退款进度、提交客服工单</small></span>
              <svg class="icon chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
            </summary>
            <div class="service-prompts">
              <button type="button" data-prompt="申请退款">申请退款</button>
              <button type="button" data-prompt="查退款进度">查退款进度</button>
              <button type="button" data-prompt="提交工单">提交工单</button>
            </div>
          </details>
        </div>
      </section>
    </aside>

    <section class="chat" aria-labelledby="chat-title">
      <header class="chat-header">
        <span class="assistant-mark"><svg class="icon" aria-hidden="true"><use href="#i-headset"/></svg></span>
        <div>
          <h1 id="chat-title">旅行助手</h1>
          <p>智能客服</p>
        </div>
        <a class="objects-jump" href="#objects-title">查看业务卡片</a>
      </header>

      <div class="chat-body">
        <div class="history-bar" id="history-bar" hidden>
          <button id="older" class="quiet-button" type="button">查看更早的消息</button>
        </div>
        <div id="welcome" class="welcome">
          <span class="welcome-mark"><svg class="icon" aria-hidden="true"><use href="#i-compass"/></svg></span>
          <h2>你好，需要什么帮助？</h2>
          <p>我可以帮你查订单和行程、咨询机票酒店，也可以协助处理退款和售后。</p>
          <div class="suggestions" aria-label="常见问题">
            <button type="button" data-prompt="帮我查订单">我的订单怎么样了？<svg class="icon" aria-hidden="true"><use href="#i-up-right"/></svg></button>
            <button type="button" data-prompt="下周一的出行">下周一有什么出行安排？<svg class="icon" aria-hidden="true"><use href="#i-up-right"/></svg></button>
            <button type="button" data-prompt="退款多久到账">退款多久到账？<svg class="icon" aria-hidden="true"><use href="#i-up-right"/></svg></button>
          </div>
        </div>
        <div id="messages" class="messages" role="log" aria-label="对话记录" aria-live="polite" hidden></div>
      </div>

      <footer class="composer">
        <p id="notice" class="notice" role="status" hidden></p>
        <div id="request-error" class="request-error" hidden>
          <p id="error" role="alert"></p>
          <button id="retry" type="button" hidden>重试</button>
        </div>
        <form id="text-form">
          <label class="sr-only" for="message-text">消息内容</label>
          <textarea id="message-text" maxlength="2000" rows="2" placeholder="输入你想咨询的问题…" required></textarea>
          <div class="sendbar">
            <span class="keyboard-hint">Enter 发送 <span aria-hidden="true">·</span> Shift + Enter 换行</span>
            <button id="send" class="primary send-button" type="submit">
              <svg class="icon" aria-hidden="true"><use href="#i-send"/></svg>发送
            </button>
          </div>
        </form>
      </footer>
    </section>

    <aside class="objects" aria-labelledby="objects-title">
      <div class="panel-heading">
        <h2 id="objects-title">业务卡片</h2>
        <button id="refresh-objects" class="quiet-button" type="button">刷新</button>
      </div>
      <div class="object-filters" aria-label="卡片分类">
        <button type="button" data-kind="orders" aria-pressed="true">订单</button>
        <button type="button" data-kind="products" aria-pressed="false">已订商品</button>
        <button type="button" data-kind="refunds" aria-pressed="false">退款</button>
        <button type="button" data-kind="tickets" aria-pressed="false">工单</button>
      </div>
      <div class="objects-body">
        <p id="objects-status" class="panel-status" role="status"></p>
        <div id="objects-list" class="objects-list"></div>
        <button id="more-objects" class="quiet-button" type="button" hidden>加载更多</button>
      </div>
    </aside>
  </main>

  <dialog id="new-chat-dialog" aria-labelledby="new-chat-title">
    <form method="dialog">
      <h2 id="new-chat-title">开始新对话？</h2>
      <p>已发送的消息会保留在历史会话里，输入框中的草稿会清空。</p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" autofocus>返回</button>
        <button type="submit" value="start" class="primary">开始新对话</button>
      </div>
    </form>
  </dialog>
</body>
</html>
